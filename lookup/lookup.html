<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Springbot Static Lookup v3 - NO NODE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f1f5f9; color: #111827; }
    header { background: #111827; color: white; padding: 18px; text-align: center; }
    header h1 { margin: 0; }
    .version { margin-top: 6px; color: #cbd5e1; font-size: 14px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    section, .summary { background: white; border: 1px solid #d1d5db; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
    .summary { display: grid; grid-template-columns: 180px 1fr; gap: 18px; }
    img { width: 180px; height: 220px; object-fit: cover; border-radius: 10px; border: 1px solid #d1d5db; background: #e5e7eb; }
    h2 { margin: 0 0 14px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    .name { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
    .status { display: inline-block; padding: 8px 14px; border-radius: 999px; font-weight: bold; border: 1px solid; }
    .green { color: #166534; background: #dcfce7; border-color: #86efac; }
    .red { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    .grid { display: grid; grid-template-columns: 220px 1fr; gap: 10px 14px; }
    .label { font-weight: bold; color: #4b5563; }
    .missing-photo, .hint { color: #6b7280; font-size: 14px; margin-top: 10px; }
    .missing-photo { display: none; }
    .error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 12px; padding: 18px; font-weight: bold; }
    @media (max-width: 700px) { .summary, .grid { grid-template-columns: 1fr; } img { width: 100%; max-width: 260px; height: auto; } }
  </style>
</head>
<body>
  <header>
    <h1>Springbot Learner Lookup</h1>
  </header>

  <main id="app">
    <div class="summary">Loading...</div>
  </main>

  <script>
    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    function statusColour(status) {
      return status === "Normal operation" ? "green" : "red";
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value + "T00:00:00");
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString("en-ZA", { year: "numeric", month: "long", day: "numeric" });
    }

    function makeNotAllocated(id) {
      return {
        learner_given_name: "",
        first_names: "",
        springbot_id: id,
        grade: "",
        dob: "",
        springbot_status: "Not allocated",
        school: { emis_number: "", school_name: "", district: "", phone: "", principal: "" }
      };
    }

    function row(label, value) {
      return `<div class="label">${esc(label)}</div><div>${esc(value)}</div>`;
    }

    function render(record, found) {
      const status = record.springbot_status || "Not allocated";
      const photo = record.springbot_id + ".jpg";
      document.getElementById("app").innerHTML = `
        <div class="summary">
          <div>
            <img src="${esc(photo)}" alt="Learner photo" onerror="this.style.display='none';document.getElementById('missingPhoto').style.display='block';">
            <div id="missingPhoto" class="missing-photo">Photo not found: ${esc(photo)}</div>
          </div>
          <div>
            <div class="name">${found ? esc(record.first_names) : "Springbot not allocated"}</div>
            <span class="status ${statusColour(status)}">${esc(status)}</span>
            <div class="hint">Springbot ID: ${esc(record.springbot_id)}</div>
          </div>
        </div>
        <section><h2>Learner info</h2><div class="grid">
          ${row("Learner given name", record.learner_given_name)}
          ${row("First names", record.first_names)}
          ${row("Springbot ID", record.springbot_id)}
          ${row("Grade", record.grade)}
          ${row("DoB", formatDate(record.dob))}
        </div></section>
        <section><h2>Springbot status</h2><div class="grid">${row("Status", status)}</div></section>
        <section><h2>School info</h2><div class="grid">
          ${row("EMIS Number", record.school.emis_number)}
          ${row("School name", record.school.school_name)}
          ${row("District", record.school.district)}
          ${row("Phone", record.school.phone)}
          ${row("Principal", record.school.principal)}
        </div></section>`;
    }

    async function main() {
      const id = getId();
      if (!id) {
        document.getElementById("app").innerHTML = `<div class="error">Missing Springbot ID. Use lookup.html?id=E00225698CE6E2B5</div>`;
        return;
      }
      try {
        const response = await fetch("learners.json?v=static-v3", { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load learners.json, HTTP " + response.status);
        const learners = await response.json();
        const record = learners.find(x => String(x.springbot_id).toUpperCase() === String(id).toUpperCase());
        render(record || makeNotAllocated(id), Boolean(record));
      } catch (error) {
        document.getElementById("app").innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    }

    main();
  </script>
</body>
</html>
