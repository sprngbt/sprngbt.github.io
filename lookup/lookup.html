<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Springbot Learner Lookup</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #d9e2ec;
      --green: #15803d;
      --red: #b91c1c;
      --green-bg: #dcfce7;
      --red-bg: #fee2e2;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .top-card {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .learner-photo {
      width: 180px;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #e5e7eb;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: bold;
      margin-top: 8px;
    }

    .status-ok {
      color: var(--green);
      background: var(--green-bg);
      border: 1px solid #86efac;
    }

    .status-bad {
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid #fca5a5;
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1, h2 {
      margin-top: 0;
    }

    h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px 18px;
    }

    .label {
      font-weight: bold;
      color: var(--muted);
    }

    .value {
      overflow-wrap: anywhere;
    }

    .error {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid #fca5a5;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 16px;
    }

    @media (max-width: 700px) {
      .top-card {
        grid-template-columns: 1fr;
      }

      .learner-photo {
        width: 100%;
        max-width: 260px;
        height: auto;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .label {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Springbot Learner Lookup</h1>
  </header>

  <main>
    <div id="output">Loading learner record...</div>
  </main>

  <script>
    const output = document.getElementById("output");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value + "T00:00:00");
      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleDateString("en-ZA", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function getSpringbotIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function getStatusClass(status) {
      return status === "Normal operation" ? "status-ok" : "status-bad";
    }

    function makeNotAllocatedRecord(springbotId) {
      return {
        learner_given_name: "",
        first_names: "",
        springbot_id: springbotId,
        grade: "",
        dob: "",
        springbot_status: "Not allocated",
        school: {
          emis_number: "",
          school_name: "",
          district: "",
          phone: "",
          principal: ""
        }
      };
    }

    function renderRecord(record, found) {
      const status = record.springbot_status || "Not allocated";
      const photoName = `${record.springbot_id}.jpg`;

      output.innerHTML = `
        <div class="top-card">
          <div>
            <img
              class="learner-photo"
              src="${escapeHtml(photoName)}"
              alt="Learner photo"
              onerror="this.style.display='none'; document.getElementById('photoMissing').style.display='block';"
            />
            <div id="photoMissing" class="small-note" style="display:none;">
              No photo found: ${escapeHtml(photoName)}
            </div>
          </div>

          <div>
            <h2>${found ? escapeHtml(record.learner_given_name) : "Springbot not allocated"}</h2>
            <div>
              <span class="status ${getStatusClass(status)}">${escapeHtml(status)}</span>
            </div>
            <p class="small-note">
              Lookup ID: ${escapeHtml(record.springbot_id)}
            </p>
          </div>
        </div>

        <section>
          <h2>Learner info</h2>
          <div class="info-grid">
            <div class="label">Learner given name</div>
            <div class="value">${escapeHtml(record.learner_given_name)}</div>

            <div class="label">First names</div>
            <div class="value">${escapeHtml(record.first_names)}</div>

            <div class="label">Springbot ID</div>
            <div class="value">${escapeHtml(record.springbot_id)}</div>

            <div class="label">Grade</div>
            <div class="value">${escapeHtml(record.grade)}</div>

            <div class="label">Date of birth</div>
            <div class="value">${escapeHtml(formatDate(record.dob))}</div>
          </div>
        </section>

        <section>
          <h2>Springbot status</h2>
          <div class="info-grid">
            <div class="label">Status</div>
            <div class="value">
              <span class="status ${getStatusClass(status)}">${escapeHtml(status)}</span>
            </div>
          </div>
        </section>

        <section>
          <h2>School info</h2>
          <div class="info-grid">
            <div class="label">EMIS Number</div>
            <div class="value">${escapeHtml(record.school?.emis_number)}</div>

            <div class="label">School name</div>
            <div class="value">${escapeHtml(record.school?.school_name)}</div>

            <div class="label">District</div>
            <div class="value">${escapeHtml(record.school?.district)}</div>

            <div class="label">Phone</div>
            <div class="value">${escapeHtml(record.school?.phone)}</div>

            <div class="label">Principal</div>
            <div class="value">${escapeHtml(record.school?.principal)}</div>
          </div>
        </section>
      `;
    }

    async function lookupLearner() {
      const springbotId = getSpringbotIdFromUrl();

      if (!springbotId) {
        output.innerHTML = `
          <div class="error">
            No Springbot ID supplied. Use for example: lookup.html?id=E0022568B80BB2A2
          </div>
        `;
        return;
      }

      try {
        const response = await fetch("learners.json", { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Could not load learners.json. HTTP status: ${response.status}`);
        }

        const learners = await response.json();

        const record = learners.find(item =>
          String(item.springbot_id).toUpperCase() === String(springbotId).toUpperCase()
        );

        if (!record) {
          renderRecord(makeNotAllocatedRecord(springbotId), false);
          return;
        }

        renderRecord(record, true);

      } catch (error) {
        output.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    lookupLearner();
  </script>
</body>
</html>
