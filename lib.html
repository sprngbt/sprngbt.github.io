<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UBL Library</title>
  <style>
    :root {
      --bg: #1f1f1f;
      --panel: rgba(34, 34, 34, 0.95);
      --panel2: rgba(44, 44, 44, 0.98);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f2f2f2;
      --muted: #b8b8b8;
      --accent: #18a0fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 10px 0;
      text-align: center;
    }

    p {
      color: var(--muted);
      text-align: center;
      margin: 0 0 20px 0;
    }

    .status {
      text-align: center;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: rgba(255,255,255,0.04);
    }

    tr:last-child td {
      border-bottom: none;
    }

    a.download-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    a.download-link:hover {
      text-decoration: underline;
    }

    .icon-col {
      width: 1%;
      white-space: nowrap;
      text-align: center;
      vertical-align: top;
    }

    .svg-icon {
      width: 2.4em;
      height: 2.4em;
      display: inline-block;
      vertical-align: top;
      background-color: currentColor;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;
      opacity: 0.95;
    }

    .svg-icon.missing {
      opacity: 0;
    }

    .desc {
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .error {
      color: #ff9c9c;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MicroBlocks xChip Libraries</h1>
    <p>Library files covering Domino4 xChips</p>
    <div id="status" class="status">Loading...</div>
    <div class="table-wrap">
      <table id="ublTable" hidden>
        <thead>
          <tr>
            <th class="icon-col">Icon</th>
            <th>Library</th>
            <th>Version</th>
            <th>Author</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadLibrary() {
      const status = document.getElementById('status');
      const table = document.getElementById('ublTable');
      const tbody = table.querySelector('tbody');

      try {
        const response = await fetch('./library/library_index.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Could not load library/library_index.json');
        }

        const data = await response.json();
        tbody.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          status.textContent = 'No library entries found.';
          return;
        }

        for (const item of data) {
          const tr = document.createElement('tr');

          const tdIcon = document.createElement('td');
          tdIcon.className = 'icon-col';

          const icon = document.createElement('span');
          icon.className = 'svg-icon';

          const baseName = (item.download || item.file || '').replace(/\.ubl$/i, '');
          const iconPath = './library/' + baseName + '.svg';
          icon.style.webkitMaskImage = 'url("' + iconPath + '")';
          icon.style.maskImage = 'url("' + iconPath + '")';

          const testImg = new Image();
          testImg.onload = () => {
            icon.style.visibility = 'visible';
          };
          testImg.onerror = () => {
            icon.classList.add('missing');
          };
          testImg.src = iconPath;

          tdIcon.appendChild(icon);

          const tdLibrary = document.createElement('td');
          const link = document.createElement('a');
          link.className = 'download-link';
          link.href = './library/' + item.download;
          link.download = item.download;
          link.textContent = item.module_name || item.download.replace(/\.ubl$/i, '');
          tdLibrary.appendChild(link);

          const tdVersion = document.createElement('td');
          tdVersion.textContent = item.version || '';

          const tdAuthor = document.createElement('td');
          tdAuthor.textContent = item.author || '';

          const tdDescription = document.createElement('td');
          tdDescription.className = 'desc';
          tdDescription.textContent = item.description || '';

          tr.appendChild(tdIcon);
          tr.appendChild(tdLibrary);
          tr.appendChild(tdVersion);
          tr.appendChild(tdAuthor);
          tr.appendChild(tdDescription);
          tbody.appendChild(tr);
        }

        status.textContent = 'Click a library name to download the .ubl file.';
        table.hidden = false;
      } catch (err) {
        status.classList.add('error');
        status.textContent = 'Failed to load library/library_index.json.';
      }
    }

    loadLibrary();
  </script>
</body>
</html>
