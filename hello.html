<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Springbot Time</title>
</head>
<body>
  <script>
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.body.textContent = `The time is ${hh}:${mm}, and Springbot says "Hello"`;
  </script>
</body>
</html>
